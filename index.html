<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Deudas</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .pagada td { text-decoration: line-through; background-color: #f1f1f1; }
    .badge-pagada { background-color: #28a745; color: white; padding: 5px 10px; border-radius: 5px; }
    @media print {
      body * { visibility: hidden; }
      #ticketContent, #ticketContent * { visibility: visible; }
      #ticketContent { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      .no-print { display: none; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="text-center mb-4">💰 Control de Deudas</h1>

  <!-- Resumen -->
  <div class="row mb-4">
    <div class="col-md-3">
      <div class="card text-white bg-primary">
        <div class="card-body">
          <h5 class="card-title">Total</h5>
          <h3 id="total">0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-success">
        <div class="card-body">
          <h5 class="card-title">Promedio</h5>
          <h3 id="promedio">$0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-warning">
        <div class="card-body">
          <h5 class="card-title">Máximo</h5>
          <h3 id="maximo">$0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-danger">
        <div class="card-body">
          <h5 class="card-title">Mínimo</h5>
          <h3 id="minimo">$0</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Formulario nueva deuda -->
  <div class="card mb-4">
    <div class="card-header">➕ Nueva Deuda</div>
    <div class="card-body">
      <form id="formDeuda">
        <div class="row">
          <div class="col-md-6 mb-2">
            <input type="text" class="form-control" id="emisor" placeholder="Emisor" required>
          </div>
          <div class="col-md-6 mb-2">
            <input type="text" class="form-control" id="receptor" placeholder="Receptor" required>
          </div>
          <div class="col-md-6 mb-2">
            <input type="text" class="form-control" id="cedula" placeholder="Cédula (opcional)">
            <small><a href="http://www.tsj.gob.ve/" target="_blank">Ir al TSJ</a></small>
          </div>
          <div class="col-md-6 mb-2">
            <input type="number" step="0.01" class="form-control" id="monto" placeholder="Monto $" required>
          </div>
          <div class="col-12 mb-2">
            <textarea class="form-control" id="descripcion" placeholder="Descripción" rows="2" required></textarea>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla de deudas -->
  <div class="card">
    <div class="card-header">📋 Listado de Deudas</div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Emisor</th><th>Receptor</th><th>Cédula</th><th>Monto</th><th>Descripción</th>
              <th>Fecha</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center mt-4 text-muted">
    App de broma - Luis Azuaje · Clave: Velocidad*20C
  </footer>
</div>

<!-- Modales -->
<div class="modal fade" id="modalEditar" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Deuda</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <input type="text" class="form-control mb-2" id="editEmisor" placeholder="Emisor">
        <input type="text" class="form-control mb-2" id="editReceptor" placeholder="Receptor">
        <input type="text" class="form-control mb-2" id="editCedula" placeholder="Cédula">
        <input type="number" step="0.01" class="form-control mb-2" id="editMonto" placeholder="Monto">
        <textarea class="form-control mb-2" id="editDescripcion" placeholder="Descripción"></textarea>
        <input type="password" class="form-control" id="editClave" placeholder="Clave de seguridad">
        <div class="text-danger" id="editError"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="confirmarEditar">Actualizar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalEliminar" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Eliminar Deuda</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="deleteId">
        <p>¿Estás seguro?</p>
        <input type="password" class="form-control" id="deleteClave" placeholder="Clave de seguridad">
        <div class="text-danger" id="deleteError"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="confirmarEliminar">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalPagar" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Marcar como Pagada</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pagarId">
        <input type="password" class="form-control" id="pagarClave" placeholder="Clave de seguridad">
        <div class="text-danger" id="pagarError"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" id="confirmarPagar">Pagar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalTicket" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header no-print">
        <h5 class="modal-title">Ticket</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="ticketContent"></div>
      <div class="modal-footer no-print">
        <button class="btn btn-primary" id="imprimirTicket">Imprimir</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function() {
  const CLAVE = "Velocidad*20C";
  const STORAGE_KEY = 'deudas_app';
  let deudas = [];

  // Cargar datos
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    deudas = stored ? JSON.parse(stored) : [];
  } catch(e) {
    deudas = [];
  }

  // Guardar y renderizar
  function guardar() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(deudas));
    renderizar();
  }

  // Renderizar todo
  function renderizar() {
    const tbody = document.getElementById('tablaBody');
    if (!deudas.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center">No hay deudas</td></tr>';
      document.getElementById('total').innerText = '0';
      document.getElementById('promedio').innerText = '$0';
      document.getElementById('maximo').innerText = '$0';
      document.getElementById('minimo').innerText = '$0';
      return;
    }

    // Ordenar por fecha
    deudas.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

    // Calcular resumen
    const montos = deudas.map(d => d.monto || 0);
    const total = deudas.length;
    const suma = montos.reduce((a,b) => a+b, 0);
    const max = Math.max(...montos);
    const min = Math.min(...montos);

    document.getElementById('total').innerText = total;
    document.getElementById('promedio').innerText = '$' + (suma/total).toFixed(2);
    document.getElementById('maximo').innerText = '$' + max.toFixed(2);
    document.getElementById('minimo').innerText = '$' + min.toFixed(2);

    // Renderizar tabla
    let html = '';
    deudas.forEach(d => {
      const fecha = new Date(d.fecha).toLocaleString();
      const pagadaClass = d.pagada ? 'pagada' : '';
      const estadoPago = d.pagada ? '<span class="badge-pagada">Pagada</span>' : 
        `<button class="btn btn-sm btn-success btn-pagar" data-id="${d.id}">Pagar</button>`;
      
      html += `<tr class="${pagadaClass}">
        <td>${d.emisor || ''}</td>
        <td>${d.receptor || ''}</td>
        <td>${d.cedula || ''}</td>
        <td>$${(d.monto || 0).toFixed(2)}</td>
        <td>${d.descripcion || ''}</td>
        <td>${fecha}</td>
        <td>
          <button class="btn btn-sm btn-warning btn-editar" data-id="${d.id}">Editar</button>
          <button class="btn btn-sm btn-danger btn-eliminar" data-id="${d.id}">Eliminar</button>
          <button class="btn btn-sm btn-info btn-ticket" data-id="${d.id}">Ticket</button>
          ${estadoPago}
        </td>
      </tr>`;
    });
    tbody.innerHTML = html;
  }

  // Nueva deuda
  document.getElementById('formDeuda').addEventListener('submit', function(e) {
    e.preventDefault();
    const nueva = {
      id: Date.now().toString(36) + Math.random().toString(36),
      emisor: document.getElementById('emisor').value,
      receptor: document.getElementById('receptor').value,
      cedula: document.getElementById('cedula').value,
      monto: parseFloat(document.getElementById('monto').value),
      descripcion: document.getElementById('descripcion').value,
      fecha: new Date().toISOString(),
      pagada: false
    };
    deudas.push(nueva);
    guardar();
    this.reset();
  });

  // Eventos de botones
  document.addEventListener('click', function(e) {
    const target = e.target;
    
    if (target.classList.contains('btn-editar')) {
      const id = target.dataset.id;
      const d = deudas.find(d => d.id === id);
      if (!d) return;
      document.getElementById('editId').value = d.id;
      document.getElementById('editEmisor').value = d.emisor || '';
      document.getElementById('editReceptor').value = d.receptor || '';
      document.getElementById('editCedula').value = d.cedula || '';
      document.getElementById('editMonto').value = d.monto || 0;
      document.getElementById('editDescripcion').value = d.descripcion || '';
      document.getElementById('editClave').value = '';
      document.getElementById('editError').innerText = '';
      new bootstrap.Modal(document.getElementById('modalEditar')).show();
    }
    
    else if (target.classList.contains('btn-eliminar')) {
      document.getElementById('deleteId').value = target.dataset.id;
      document.getElementById('deleteClave').value = '';
      document.getElementById('deleteError').innerText = '';
      new bootstrap.Modal(document.getElementById('modalEliminar')).show();
    }
    
    else if (target.classList.contains('btn-pagar')) {
      document.getElementById('pagarId').value = target.dataset.id;
      document.getElementById('pagarClave').value = '';
      document.getElementById('pagarError').innerText = '';
      new bootstrap.Modal(document.getElementById('modalPagar')).show();
    }
    
    else if (target.classList.contains('btn-ticket')) {
      const id = target.dataset.id;
      const d = deudas.find(d => d.id === id);
      if (!d) return;
      document.getElementById('ticketContent').innerHTML = `
        <div style="font-family: monospace;">
          <h4>TICKET DE DEUDA</h4>
          <p><strong>ID:</strong> ${d.id}</p>
          <p><strong>Emisor:</strong> ${d.emisor}</p>
          <p><strong>Receptor:</strong> ${d.receptor}</p>
          <p><strong>Cédula:</strong> ${d.cedula || 'N/A'}</p>
          <p><strong>Monto:</strong> $${d.monto.toFixed(2)}</p>
          <p><strong>Descripción:</strong> ${d.descripcion}</p>
          <p><strong>Fecha:</strong> ${new Date(d.fecha).toLocaleString()}</p>
          <p><strong>Estado:</strong> ${d.pagada ? 'PAGADA' : 'PENDIENTE'}</p>
          <p>App de broma - Luis Azuaje</p>
        </div>
      `;
      new bootstrap.Modal(document.getElementById('modalTicket')).show();
    }
  });

  // Confirmar Editar
  document.getElementById('confirmarEditar').addEventListener('click', function() {
    if (document.getElementById('editClave').value !== CLAVE) {
      document.getElementById('editError').innerText = 'Clave incorrecta';
      return;
    }
    const id = document.getElementById('editId').value;
    const index = deudas.findIndex(d => d.id === id);
    if (index !== -1) {
      deudas[index] = {
        ...deudas[index],
        emisor: document.getElementById('editEmisor').value,
        receptor: document.getElementById('editReceptor').value,
        cedula: document.getElementById('editCedula').value,
        monto: parseFloat(document.getElementById('editMonto').value),
        descripcion: document.getElementById('editDescripcion').value
      };
      guardar();
      bootstrap.Modal.getInstance(document.getElementById('modalEditar')).hide();
    }
  });

  // Confirmar Eliminar
  document.getElementById('confirmarEliminar').addEventListener('click', function() {
    if (document.getElementById('deleteClave').value !== CLAVE) {
      document.getElementById('deleteError').innerText = 'Clave incorrecta';
      return;
    }
    const id = document.getElementById('deleteId').value;
    deudas = deudas.filter(d => d.id !== id);
    guardar();
    bootstrap.Modal.getInstance(document.getElementById('modalEliminar')).hide();
  });

  // Confirmar Pagar
  document.getElementById('confirmarPagar').addEventListener('click', function() {
    if (document.getElementById('pagarClave').value !== CLAVE) {
      document.getElementById('pagarError').innerText = 'Clave incorrecta';
      return;
    }
    const id = document.getElementById('pagarId').value;
    const index = deudas.findIndex(d => d.id === id);
    if (index !== -1) {
      deudas[index].pagada = true;
      guardar();
      bootstrap.Modal.getInstance(document.getElementById('modalPagar')).hide();
    }
  });

  // Imprimir ticket
  document.getElementById('imprimirTicket').addEventListener('click', function() {
    window.print();
  });

  // Render inicial
  renderizar();
})();
</script>

</body>
</html>
